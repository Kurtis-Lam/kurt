[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kurt"
version = "0.2.0"
description = "Terminal coding assistant powered by local models via Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["rich>=13"]

[project.scripts]
kurt = "kurt:main"

[tool.setuptools]
py-modules = ["kurt"]