[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kurt"
version = "0.5.0"
description = "Terminal coding assistant with local Ollama and remote model providers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["rich>=13"]

[project.scripts]
kurt = "kurt:main"

[tool.setuptools]
py-modules = ["kurt", "providers", "kurt_web", "kurt_sandbox"]
